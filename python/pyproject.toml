[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxybrush"
version = "0.4.0a0"
description = "Python scripting and plugin SDK for the OxyBrush digital sculpting application"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "OxyBrush Contributors" }
]
keywords = ["sculpting", "3d", "oxybrush", "plugins", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/crisprintsstuff/OxyBrush"
Repository = "https://github.com/crisprintsstuff/OxyBrush"
