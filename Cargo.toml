[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crisprintsstuff/OxyBrush"
rust-version = "1.88"

[workspace.dependencies]
oxy-mesh = { path = "crates/oxy-mesh" }
oxy-sculpt = { path = "crates/oxy-sculpt" }
oxy-history = { path = "crates/oxy-history" }
oxy-io = { path = "crates/oxy-io" }
oxy-render = { path = "crates/oxy-render" }

glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
tobj = "4"
wgpu = "30"
winit = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = { version = "0.37", features = ["accesskit"] }
rfd = "0.17"
pollster = "1"
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
