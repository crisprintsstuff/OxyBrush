[package]
name = "oxy-app"
description = "OxyBrush desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxybrush"
path = "src/main.rs"

[features]
# Opt-in update checks and downloads (docs/rfcs/0002-updates.md). Build with
# --no-default-features for a copy with no network code at all.
default = ["updater"]
updater = ["oxy-update/network"]

[dependencies]
oxy-mesh.workspace = true
oxy-sculpt.workspace = true
oxy-history.workspace = true
oxy-io.workspace = true
oxy-render.workspace = true
oxy-doc.workspace = true
oxy-topo.workspace = true
oxy-mcp.workspace = true
oxy-plugin.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true
rfd.workspace = true
dirs.workspace = true
png.workspace = true
# JPEG matcaps (pure Rust; MIT OR Apache-2.0 OR Zlib).
zune-jpeg = "0.5"
oxy-update.workspace = true
rayon.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
