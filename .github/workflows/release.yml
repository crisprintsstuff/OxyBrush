name: Release builds

# Builds downloadable test binaries for Windows and Linux.
# Manual runs upload workflow artifacts; pushing a `v*` tag also creates a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: oxybrush-windows-x86_64.zip
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: oxybrush-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p oxy-app --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/oxybrush.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/oxybrush
          cp target/${{ matrix.target }}/release/oxybrush README.md LICENSE-MIT LICENSE-APACHE dist/oxybrush/
          tar -C dist -czf ${{ matrix.archive }} oxybrush
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.archive }}
          prerelease: true
