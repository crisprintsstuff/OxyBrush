name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Corpus IP guard (no ZBrush files; docs/formats/zbrush/LEGAL.md)
        run: python3 scripts/check_corpus_ip.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All three supported platforms must pass.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p oxy-app

  screenshot:
    name: headless render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Test glass and X-ray on Vulkan software rendering
        env:
          WGPU_BACKEND: vulkan
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test -p oxy-render --test xray -- --ignored
      - run: cargo build -p oxy-app
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" env XDG_RUNTIME_DIR=/tmp ./target/debug/oxybrush --demo --screenshot screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
